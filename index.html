<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamez4jali</title>
<style>
  :root { --ink: #1e3557; --muted: #4a5f7f; --accent: #1c80d6; --bg: #f8fcff; --card: #ffffff; --line: #d6e6f5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 32px; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 22px; margin: 0 0 6px; }
  .meta { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin: 16px 0; }
  .btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; padding: 10px 18px; border-radius: 10px; margin: 8px 8px 0 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Gamez4jali</h1>
  <p class="meta">Small, friendly mobile games. Contact: <a href="mailto:gamez4jali@gmail.com">gamez4jali@gmail.com</a></p>

  <div class="card">
    <h2>Smash It: Whack-a-Mole</h2>
    <p>A fast arcade game: whack the moles, dodge the bombs, beat the Boss Mole and race up the world ranks.
    No ads. Sign in with Google Play Games or play as a guest.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.DefaultCompany.WhackaMolemania">Get it on Google Play</a>
    <a class="btn" href="privacy-policy.html">Privacy Policy</a>
  </div>
</main>
</body>
</html>
